name: Frontend Check

on:
  pull_request:
    paths:
      - 'frontend/**'
  push:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # TODO: apos commitar frontend/package-lock.json, trocar
      # npm install por npm ci e reativar cache: 'npm'
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
