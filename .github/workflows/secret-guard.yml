name: Secret Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bloqueia arquivos .env versionados
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v example; then
            echo 'ERRO: arquivo .env versionado. Use .env.example.'
            exit 1
          fi
          echo 'OK: nenhum .env versionado.'

      - name: Bloqueia service_role key no codigo
        run: |
          if git grep -nIE 'SERVICE_ROLE[A-Z_]*[[:space:]]*[=:][[:space:]]*[^[:space:]#]{12,}' -- .; then
            echo 'ERRO: possivel service_role key comitada. Rotacione a chave no painel do Supabase.'
            exit 1
          fi
          echo 'OK: nenhuma service_role key encontrada.'
