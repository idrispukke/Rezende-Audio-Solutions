name: CI
on:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Type check (mypy)
        run: mypy backend/src || true

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        run: |
          pytest -q --maxfail=1 || true

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t rezende-backend:ci -f backend/Dockerfile backend
      - name: Smoke test container
        run: |
          docker run -d --name rezende_ci -p 8000:8000 rezende-backend:ci
          sleep 10
          if ! curl -fsS http://localhost:8000/health && ! curl -fsS http://localhost:8000/; then
            echo "Smoke test failed, container logs:"
            docker logs rezende_ci --tail=200 || true
            docker stop rezende_ci || true
            exit 1
          fi
          docker stop rezende_ci || true
