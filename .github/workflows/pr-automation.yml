name: PR Automation

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  assign-and-request-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Assign author and request review
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            // Assignee: sempre o autor do PR
            try {
              await github.rest.issues.addAssignees({
                owner, repo, issue_number: pr.number, assignees: [author],
              });
              core.info('Assignee definido: ' + author);
            } catch (e) {
              core.warning('Falha ao definir assignee: ' + e.message);
            }

            // Reviewers: nunca o proprio autor - a API do GitHub rejeita
            const wanted = ['idrispukke'];
            const reviewers = wanted.filter(u => u.toLowerCase() !== author.toLowerCase());

            if (reviewers.length === 0) {
              core.info('Autor (' + author + ') e o unico reviewer configurado - nada a solicitar.');
              return;
            }

            try {
              await github.rest.pulls.requestReviewers({
                owner, repo, pull_number: pr.number, reviewers,
              });
              core.info('Review solicitado de: ' + reviewers.join(', '));
            } catch (e) {
              core.warning('Falha ao solicitar review: ' + e.message);
            }
